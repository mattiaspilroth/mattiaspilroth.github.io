baseURL = 'https://mattiaspilroth.com/'
languageCode = 'en-us'
title = 'Mattias Pilroth | Principal OT Security Architect'
enableRobotsTXT = true

[params]
    author = "Mattias Pilroth"
    description = "Principal OT Security Architect and Industrial Cybersecurity Advisor. Consequence-driven architecture for high-hazard industrial environments."
    profile_image = "images/profile.jpg"
    og_image = "images/og-image.jpg"
    github = "https://github.com/mattiaspilroth"
    linkedin = "https://www.linkedin.com/in/mattiaspilroth/"
    email = "mattias@pilroth.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    noClasses = true
    style = "github"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"