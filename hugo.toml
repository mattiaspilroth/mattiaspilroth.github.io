baseURL = 'https://mattiaspilroth.com/'
languageCode = 'en-us'
title = 'Mattias Pilroth | OT Security Architecture'
enableRobotsTXT = true

[params]
    author = "Mattias Pilroth"
    description = "OT security architecture for chemical manufacturing, grounded in operational experience at a SEVESO high-hazard facility. IEC 61511 and IEC 62443."
    profile_image = "images/profile.jpg"
    og_image = "images/og-image.jpg"
    github = "https://github.com/mattiaspilroth"
    linkedin = "https://www.linkedin.com/in/mattiaspilroth/"
    email = "mattias@pilroth.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    noClasses = true
    style = "github"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "RSS", "Sitemap"]

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"