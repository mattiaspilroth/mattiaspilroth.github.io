<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <meta name="description" content="{{ .Summary | default .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Summary | default .Site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}{{ .Site.Params.og_image }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
  
  {{ $style := resources.Get "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">

  <script defer src="https://cloud.umami.is/script.js" data-website-id="7175ecb6-6d10-4e70-8f33-cc9f0e1226b4"></script>
  
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "headline": "{{ .Title }}",
    "description": "{{ .Summary | default .Site.Params.description }}",
    "url": "{{ .Permalink }}",
    "author": {
      "@type": "Person",
      "name": "{{ .Site.Params.author }}",
      "url": "{{ .Site.BaseURL }}"
    }
  }
  </script>
</head>

<body>
  <main>
    <nav style="margin-bottom: 3rem; font-size: 0.9rem;">
      <a href="/" data-umami-event="click-back-to-home">&larr; Back to Home</a>
    </nav>

    <article>
      <div class="content">
        {{ .Content }}
      </div>
    </article>

    <footer>
      <p class="links">
        <a href="{{ .Site.Params.github }}" target="_blank" rel="me noopener noreferrer" data-umami-event="click-footer-github">GitHub</a> ·
        <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="me noopener noreferrer" data-umami-event="click-footer-linkedin">LinkedIn</a> ·
        <a href="mailto:{{ .Site.Params.email }}" data-umami-event="click-footer-email">Email</a>
      </p>
      <p class="disclaimer">
        Personal technical observations based on professional experience. Not employer or vendor guidance.
      </p>
    </footer>
  </main>
</body>
</html>
