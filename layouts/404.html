<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | {{ .Site.Title }}</title>
  
  {{ $style := resources.Get "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
</head>

<body>
  <main>
    <nav class="article-nav">
      <a href="/">&larr; Back to Home</a>
    </nav>

    <article>
      <header class="article-header" style="margin-top: 15vh;">
        <h1>404: Resource Not Found</h1>
      </header>

      <div class="content">
        <p>The requested document or architecture pattern is not available at this URL.</p>
        <p>The file path may have changed, or the resource has been removed.</p>
      </div>
    </article>
  </main>
</body>
</html>
